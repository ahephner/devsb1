<template>
    <lightning-card title="Working on Dynamic Show">
        <div class="slds-p-around_medium">
            <h1>
                AJ working on showing dynamic values
            </h1>
            <template if:true={recordId}>
                <lightning-combobox
                    name='box'
                    lwc:ref="prodBox"
                    class='areaBox'
                    label="Filter by Product"
                    value={showValue}
                    options={productList}
                    onchange={filterProd} 
                    ></lightning-combobox>
            </template>
            <!-- Pinned products table -->

            <div class="grid-container">
                <!-- <div class="tableBtn"> -->
                    <div class="grid-table">
                        
                        <!-- Header Column (1st col of each row) -->
                        <div class="cell header">Product Name</div>
                        <div class="cell header">Rate</div>
                        <div class="cell header">Unit Area</div>
                        <div class="cell header">Price</div>
                        <div class="cell header">N</div>
                        <div class="cell header">P</div>
                        <div class="cell header">K</div>
                        <div class="cell header">Cost per M</div>
                        <div class="cell header">Cost per Acre</div>
                        <div class="cell header">Replace</div>
                        
                        <template for:each={tableProduct} for:item="x" for:index="i">
                            
  
<div key={x.id} class="cell">{x.label}</div>
  <div key={x.id} class="cell">
      <lightning-input 
        type="number"
        value={x.rate2}
        onchange={handleRate}
        name={x.Product__c}></lightning-input>
    </div>
    <div key={x.id} class="cell">
      <lightning-combobox
        name={x.Product__c}
        value={x.unitMeasure}
        options={unitArea}
        onchange={handleUnitArea}></lightning-combobox>
    </div>
    <div key={x.id} class="cell">
      <lightning-input 
        type="number"
        formatter="currency" 
        step="0.01"
        value={x.price}
        onchange={handlePrice}
        name={x.Product__c}></lightning-input>
    </div>
    <div key={x.id} class="cell">{x.N__c}</div>
    <div key={x.id} class="cell">{x.P__c}</div>
    <div key={x.id} class="cell">{x.K__c}</div>
    <div key={x.id} class="cell">${x.Cost_per_M__c}</div>
    <div key={x.id} class="cell">${x.Cost_per_Acre__c}</div>
    <template lwc:if={x.firstItem}>
        <div key={x.id} class="cell"><lightning-input type="toggle"  name={x.Product__c} onchange={handleReplacement}></lightning-input></div>

    </template>
    <template lwc:else>
        <div class='cell' key={x.id}></div>
    </template>
    
    
 
</template>

  <!-- <div class="cell">Turf A</div>
  <div class="cell">3.5</div>
  <div class="cell">lb</div>
  <div class="cell">$12.00</div>
  <div class="cell">1.2</div>
  <div class="cell">0.5</div>
  <div class="cell">0.3</div>
  <div class="cell">$0.75</div>
  <div class="cell">$3.50</div> -->

  
  <template lwc:if={showCompareBtn}>
      <lightning-button 
      label="Compare" 
      name={btnName} 
      onclick={handleAddToCompare} 
      variant="success"></lightning-button>
    </template>
    <template lwc:elseif={searchProd}>
        <c-product2-look-up onnewproduct={handleProductSelect}></c-product2-look-up>                
    </template>
    <template lwc:elseif={maxPick}>
        <p>Max Compares</p>                
    </template>
    <template lwc:else>
        
    </template>

</div>
<!-- </div> -->
</div>

            <!-- Comparison            
            <template if:true={compareProducts}>
                <div class="slds-m-top_medium slds-box">
                    <h4>Comparison:</h4>
                    <template for:each={compareProducts} for:item="product">
                        <div key={product.id}>
                            <span>{product.name} - ${product.price}</span>
                        </div>
                    </template>
                </div>
            </template> -->

        </div>
    </lightning-card>

</template>
